<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <linearGradient id="brArtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021c3b" />
      <stop offset="50%" stop-color="#052c5c" />
      <stop offset="100%" stop-color="#011326" />
    </linearGradient>
    <linearGradient id="brArtBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>
    <filter id="brArtShadow" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="320" rx="18" fill="url(#brArtBg)" />
  <rect width="1000" height="320" rx="18" fill="none" stroke="#ffb703" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Soft Ambient Glow -->
  <circle cx="900" cy="80" r="140" fill="#0077b6" fill-opacity="0.14" filter="blur(30px)" />
  <circle cx="80" cy="240" r="120" fill="#ffb703" fill-opacity="0.08" filter="blur(30px)" />

  <!-- Badge -->
  <g transform="translate(40, 32)">
    <rect x="0" y="0" width="200" height="26" rx="13" fill="#ffb703" fill-opacity="0.18" stroke="#ffb703" stroke-opacity="0.6" stroke-width="1" />
    <text x="12" y="17" fill="#ffb703" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" letter-spacing="1">🇮🇳 OFFICIAL INDIA PARTNER</text>
  </g>

  <!-- Heading -->
  <g transform="translate(40, 95)">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">
      अपनी वेबसाइट या बिज़नेस के लिए .IN डोमेन बुक करें
    </text>
    <text x="0" y="32" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">
      BigRock India से पाएं — <tspan fill="#ffb703" font-weight="800">70% तक की भारी छूट + NVMe SSD होस्टिंग + 24x7 फोन सपोर्ट</tspan>
    </text>
  </g>

  <!-- Feature Bullet Points -->
  <g transform="translate(40, 175)">
    <g transform="translate(0, 0)">
      <circle cx="12" cy="12" r="12" fill="#0077b6" fill-opacity="0.4" />
      <text x="12" y="16" text-anchor="middle" font-size="12">✓</text>
      <text x="32" y="16" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">भारत में सबसे लोकप्रिय .IN डोमेन</text>
    </g>

    <g transform="translate(240, 0)">
      <circle cx="12" cy="12" r="12" fill="#0077b6" fill-opacity="0.4" />
      <text x="12" y="16" text-anchor="middle" font-size="12">✓</text>
      <text x="32" y="16" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">फ्री बिजनेस ईमेल &amp; SSL</text>
    </g>

    <g transform="translate(480, 0)">
      <circle cx="12" cy="12" r="12" fill="#0077b6" fill-opacity="0.4" />
      <text x="12" y="16" text-anchor="middle" font-size="12">✓</text>
      <text x="32" y="16" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">100% भारतीय सर्वर विकल्प</text>
    </g>
  </g>

  <!-- Bottom CTA Row -->
  <g transform="translate(40, 235)">
    <rect x="0" y="4" width="160" height="38" rx="10" fill="#031e40" stroke="#ffb703" stroke-opacity="0.5" stroke-width="1.2" />
    <text x="80" y="27" text-anchor="middle" fill="#ffb703" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900">
      70% तक की छूट*
    </text>

    <g transform="translate(680, -6)">
      <rect x="0" y="0" width="240" height="52" rx="16" fill="url(#brArtBtn)" filter="url(#brArtShadow)" />
      <text x="120" y="32" text-anchor="middle" fill="#021c3b" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900">
        BigRock ऑफर देखें →
      </text>
    </g>
  </g>
</svg>
