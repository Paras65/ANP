<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="brBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021c3b" />
      <stop offset="50%" stop-color="#052c5c" />
      <stop offset="100%" stop-color="#011326" />
    </linearGradient>
    <linearGradient id="brBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>
    <linearGradient id="brCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08366e" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#041d40" stop-opacity="0.85" />
    </linearGradient>
    <filter id="brShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="480" rx="20" fill="url(#brBg)" />
  <rect width="1000" height="480" rx="20" fill="none" stroke="#ffb703" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Ambient Glow Circles -->
  <circle cx="850" cy="120" r="180" fill="#0077b6" fill-opacity="0.16" filter="blur(45px)" />
  <circle cx="150" cy="380" r="160" fill="#ffb703" fill-opacity="0.1" filter="blur(40px)" />

  <!-- Subtle Geometric Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="120" x2="1000" y2="120" />
    <line x1="0" y1="240" x2="1000" y2="240" />
    <line x1="0" y1="360" x2="1000" y2="360" />
    <line x1="250" y1="0" x2="250" y2="480" />
    <line x1="500" y1="0" x2="500" y2="480" />
    <line x1="750" y1="0" x2="750" y2="480" />
  </g>

  <!-- Header Category Pill -->
  <g transform="translate(48, 38)">
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#ffb703" fill-opacity="0.18" stroke="#ffb703" stroke-opacity="0.6" stroke-width="1" />
    <text x="14" y="19" fill="#ffb703" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" letter-spacing="1">🇮🇳 BIGROCK INDIA PARTNER</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(48, 105)">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" letter-spacing="-0.5">
      BigRock • भारत का नंबर 1 डोमेन व वेब होस्टिंग!
    </text>
    <text x="0" y="38" fill="#90e0ef" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">
      .IN व .COM डोमेन और सुपरफास्ट होस्टिंग पर <tspan fill="#ffb703" font-weight="900">फ्लैट 70% तक की छूट</tspan>
    </text>
  </g>

  <!-- 3 Value Proposition Cards -->
  <g transform="translate(48, 180)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="280" height="110" rx="16" fill="url(#brCard)" stroke="#0077b6" stroke-opacity="0.4" stroke-width="1.2" filter="url(#brShadow)" />
    <circle cx="36" cy="38" r="18" fill="#0077b6" fill-opacity="0.35" />
    <text x="36" y="44" text-anchor="middle" font-size="18">🇮🇳</text>
    <text x="68" y="34" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800">.IN डोमेन स्पेशल ऑफर</text>
    <text x="68" y="56" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">भारत का अपना पहचान डोमेन</text>
    <text x="68" y="76" fill="#4ade80" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">मात्र ₹399/वर्ष से शुरू</text>

    <!-- Card 2 -->
    <rect x="310" y="0" width="280" height="110" rx="16" fill="url(#brCard)" stroke="#0077b6" stroke-opacity="0.4" stroke-width="1.2" filter="url(#brShadow)" />
    <circle cx="346" cy="38" r="18" fill="#0077b6" fill-opacity="0.35" />
    <text x="346" y="44" text-anchor="middle" font-size="18">⚡</text>
    <text x="378" y="34" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800">सुपरफास्ट वेब होस्टिंग</text>
    <text x="378" y="56" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">NVMe SSD + 99.9% अपटाइम</text>
    <text x="378" y="76" fill="#ffb703" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">मुफ़्त SSL + ईमेल शामिल</text>

    <!-- Card 3 -->
    <rect x="620" y="0" width="280" height="110" rx="16" fill="url(#brCard)" stroke="#0077b6" stroke-opacity="0.4" stroke-width="1.2" filter="url(#brShadow)" />
    <circle cx="656" cy="38" r="18" fill="#0077b6" fill-opacity="0.35" />
    <text x="656" y="44" text-anchor="middle" font-size="18">📞</text>
    <text x="688" y="34" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800">24x7 लोकल सपोर्ट</text>
    <text x="688" y="56" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">हिंदी व अंग्रेजी फोन सपोर्ट</text>
    <text x="688" y="76" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">तुरंत समस्या समाधान</text>
  </g>

  <!-- Bottom Action Bar: Discount Pill + CTA Button -->
  <g transform="translate(48, 335)">
    <!-- Discount highlight -->
    <rect x="0" y="8" width="140" height="42" rx="10" fill="#e63946" />
    <text x="70" y="35" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900">
      FLAT 70% OFF
    </text>

    <!-- Price -->
    <text x="155" y="24" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">BigRock शुरुआती प्लान:</text>
    <text x="155" y="50" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900">
      <tspan fill="#ffb703">₹79</tspan><tspan font-size="14" fill="#cbd5e1"> / महीना से*</tspan>
    </text>

    <!-- Big Action Button -->
    <g transform="translate(580, 0)">
      <rect x="0" y="0" width="320" height="58" rx="18" fill="url(#brBtn)" filter="url(#brShadow)" />
      <text x="160" y="36" text-anchor="middle" fill="#021c3b" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900">
        ऑफर देखें (BigRock India) →
      </text>
    </g>
  </g>
</svg>
