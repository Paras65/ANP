<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" width="100%" height="100%">
  <defs>
    <linearGradient id="brHdrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021c3b" />
      <stop offset="50%" stop-color="#043269" />
      <stop offset="100%" stop-color="#011326" />
    </linearGradient>
    <linearGradient id="brHdrBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>
    <linearGradient id="brGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077b6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0077b6" stop-opacity="0" />
    </linearGradient>
    <filter id="brHdrShadow" x="-5%" y="-10%" width="115%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="160" rx="16" fill="url(#brHdrBg)" />
  <rect width="1000" height="160" rx="16" fill="none" stroke="#ffb703" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Speed Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="40" x2="1000" y2="40" />
    <line x1="0" y1="80" x2="1000" y2="80" />
    <line x1="0" y1="120" x2="1000" y2="120" />
    <line x1="200" y1="0" x2="200" y2="160" />
    <line x1="400" y1="0" x2="400" y2="160" />
    <line x1="600" y1="0" x2="600" y2="160" />
    <line x1="800" y1="0" x2="800" y2="160" />
  </g>

  <!-- Glow -->
  <circle cx="90" cy="80" r="120" fill="url(#brGlow)" filter="blur(20px)" />

  <!-- Left: BigRock Brand Icon -->
  <g transform="translate(24, 28)">
    <rect x="0" y="0" width="104" height="104" rx="20" fill="#042654" stroke="#ffb703" stroke-width="2.5" filter="url(#brHdrShadow)" />
    <!-- Rock / Mountain Silhouette Symbol -->
    <path d="M52 24 L24 78 L80 78 Z" fill="#ffb703" />
    <path d="M52 38 L36 78 L68 78 Z" fill="#fb8500" />
    <circle cx="52" cy="56" r="4" fill="#ffffff" />
  </g>

  <!-- Brand Name & Deal Badge -->
  <g transform="translate(144, 34)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="195" height="22" rx="11" fill="#ffb703" fill-opacity="0.18" stroke="#ffb703" stroke-opacity="0.6" stroke-width="1" />
      <text x="10" y="15" fill="#ffb703" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">🇮🇳 BIGROCK INDIA DEAL • 70% OFF</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="52" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" letter-spacing="-0.5">
      BigRock India <tspan fill="#ffb703">• .IN डोमेन व वेब होस्टिंग</tspan>
    </text>

    <!-- Subtitle / Perks -->
    <text x="0" y="78" fill="#90e0ef" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">
      सुपरफास्ट SSD होस्टिंग + मुफ़्त SSL + 24x7 हिंदी व अंग्रेजी कस्टमर सपोर्ट
    </text>
  </g>

  <!-- Center-Right: Price Highlight Badge -->
  <g transform="translate(630, 28)">
    <rect x="0" y="0" width="150" height="104" rx="16" fill="#031e40" stroke="#0077b6" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="75" y="28" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">शुरुआती कीमत</text>
    <text x="75" y="64" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900">
      <tspan fill="#ffb703">₹79</tspan><tspan font-size="13" fill="#94a3b8">/माह*</tspan>
    </text>
    <text x="75" y="88" text-anchor="middle" fill="#4ade80" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">70% भारी छूट</text>
  </g>

  <!-- Right: CTA Button -->
  <g transform="translate(800, 44)">
    <rect x="0" y="0" width="176" height="72" rx="18" fill="url(#brHdrBtn)" filter="url(#brHdrShadow)" />
    <text x="88" y="38" text-anchor="middle" fill="#021c3b" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" letter-spacing="0.2">
      ऑफर प्राप्त करें →
    </text>
    <text x="88" y="58" text-anchor="middle" fill="#021c3b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">
      (BigRock India)
    </text>
  </g>
</svg>
