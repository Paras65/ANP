<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <linearGradient id="artBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02162e" />
      <stop offset="50%" stop-color="#062952" />
      <stop offset="100%" stop-color="#021427" />
    </linearGradient>
    <linearGradient id="artBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb81c" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="artShadow" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="320" rx="18" fill="url(#artBg)" />
  <rect width="1000" height="320" rx="18" fill="none" stroke="#00a8e8" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Soft Ambient Glow -->
  <circle cx="900" cy="80" r="140" fill="#00a8e8" fill-opacity="0.1" filter="blur(30px)" />
  <circle cx="80" cy="240" r="120" fill="#ffb81c" fill-opacity="0.08" filter="blur(30px)" />

  <!-- Badge -->
  <g transform="translate(40, 32)">
    <rect x="0" y="0" width="230" height="26" rx="13" fill="#ffb81c" fill-opacity="0.15" stroke="#ffb81c" stroke-opacity="0.5" stroke-width="1" />
    <text x="12" y="17" fill="#ffb81c" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" letter-spacing="1">✨ विशेष डिजिटल पार्टनर</text>
  </g>

  <!-- Heading -->
  <g transform="translate(40, 95)">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">
      क्या आप अपने बिज़नेस, दुकान या स्कूल को ऑनलाइन ले जाना चाहते हैं?
    </text>
    <text x="0" y="32" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">
      HostGator India के साथ बनाएं अपनी प्रोफेशनल वेबसाइट — <tspan fill="#ffb81c" font-weight="800">60% छूट + मुफ़्त डोमेन + फ्री SSL</tspan>
    </text>
  </g>

  <!-- Feature Bullet Points -->
  <g transform="translate(40, 175)">
    <g transform="translate(0, 0)">
      <circle cx="12" cy="12" r="12" fill="#0054b4" fill-opacity="0.4" />
      <text x="12" y="16" text-anchor="middle" font-size="12">✓</text>
      <text x="32" y="16" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1-क्लिक वर्डप्रेस सेटअप</text>
    </g>

    <g transform="translate(220, 0)">
      <circle cx="12" cy="12" r="12" fill="#0054b4" fill-opacity="0.4" />
      <text x="12" y="16" text-anchor="middle" font-size="12">✓</text>
      <text x="32" y="16" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">अनलिमिटेड बैंडविड्थ</text>
    </g>

    <g transform="translate(440, 0)">
      <circle cx="12" cy="12" r="12" fill="#0054b4" fill-opacity="0.4" />
      <text x="12" y="16" text-anchor="middle" font-size="12">✓</text>
      <text x="32" y="16" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">24/7 फोन व चैट सपोर्ट</text>
    </g>
  </g>

  <!-- Bottom CTA Row -->
  <g transform="translate(40, 235)">
    <rect x="0" y="4" width="160" height="38" rx="10" fill="#031a33" stroke="#ffb81c" stroke-opacity="0.4" stroke-width="1.2" />
    <text x="80" y="27" text-anchor="middle" fill="#ffb81c" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900">
      मात्र ₹79/माह*
    </text>

    <g transform="translate(680, -6)">
      <rect x="0" y="0" width="240" height="52" rx="16" fill="url(#artBtn)" filter="url(#artShadow)" />
      <text x="120" y="32" text-anchor="middle" fill="#02162e" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900">
        HostGator ऑफर देखें →
      </text>
    </g>
  </g>
</svg>
