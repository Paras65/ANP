<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02162e" />
      <stop offset="45%" stop-color="#072b54" />
      <stop offset="100%" stop-color="#021428" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb81c" />
      <stop offset="100%" stop-color="#ff8c00" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a8e8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00a8e8" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-10%" width="115%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="160" rx="16" fill="url(#bgGrad)" />
  <rect width="1000" height="160" rx="16" fill="none" stroke="#00a8e8" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Subtle Speed Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="40" x2="1000" y2="40" />
    <line x1="0" y1="80" x2="1000" y2="80" />
    <line x1="0" y1="120" x2="1000" y2="120" />
    <line x1="200" y1="0" x2="200" y2="160" />
    <line x1="400" y1="0" x2="400" y2="160" />
    <line x1="600" y1="0" x2="600" y2="160" />
    <line x1="800" y1="0" x2="800" y2="160" />
  </g>

  <!-- Brand Glow Circle -->
  <circle cx="90" cy="80" r="120" fill="url(#glowGrad)" filter="blur(20px)" />

  <!-- Left: Mascot / Server Icon -->
  <g transform="translate(24, 28)">
    <rect x="0" y="0" width="104" height="104" rx="20" fill="#003566" stroke="#ffb81c" stroke-width="2.5" filter="url(#shadow)" />
    <!-- Lightning / Gator Teeth Crest -->
    <path d="M52 20 L28 58 L48 58 L42 84 L76 48 L56 48 Z" fill="#ffb81c" />
    <circle cx="52" cy="52" r="3" fill="#ffffff" />
  </g>

  <!-- Brand Name & Deal Badge -->
  <g transform="translate(144, 34)">
    <!-- Badge -->
    <rect x="0" y="0" width="210" height="22" rx="11" fill="#ffb81c" fill-opacity="0.15" stroke="#ffb81c" stroke-opacity="0.5" stroke-width="1" />
    <text x="10" y="15" fill="#ffb81c" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">⚡ OFFICIAL PARTNER DEAL</text>

    <!-- Main Title -->
    <text x="0" y="52" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" letter-spacing="-0.5">
      HostGator India <tspan fill="#ffb81c">• 60% छूट</tspan>
    </text>

    <!-- Subtitle / Perks -->
    <text x="0" y="78" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">
      मुफ़्त .IN/.COM डोमेन + फ्री SSL + 99.9% अपटाइम
    </text>
  </g>

  <!-- Center-Right: Price Highlight Badge -->
  <g transform="translate(630, 28)">
    <rect x="0" y="0" width="150" height="104" rx="16" fill="#041a33" stroke="#00a8e8" stroke-opacity="0.35" stroke-width="1.5" />
    <text x="75" y="28" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">शुरुआती कीमत</text>
    <text x="75" y="64" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900">
      <tspan fill="#ffb81c">₹79</tspan><tspan font-size="14" fill="#94a3b8">/माह*</tspan>
    </text>
    <text x="75" y="88" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">फ्लैट 60% OFF</text>
  </g>

  <!-- Right: CTA Button -->
  <g transform="translate(800, 44)">
    <rect x="0" y="0" width="176" height="72" rx="18" fill="url(#btnGrad)" filter="url(#shadow)" />
    <text x="88" y="38" text-anchor="middle" fill="#02162e" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" letter-spacing="0.2">
      ऑफर लें →
    </text>
    <text x="88" y="58" text-anchor="middle" fill="#02162e" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">
      (Claim Offer)
    </text>
  </g>
</svg>
