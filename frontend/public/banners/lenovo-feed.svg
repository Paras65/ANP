<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="lenovoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121214" />
      <stop offset="55%" stop-color="#1e1b22" />
      <stop offset="100%" stop-color="#0d0e12" />
    </linearGradient>
    <linearGradient id="lenovoRedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2231a" />
      <stop offset="100%" stop-color="#ff3d34" />
    </linearGradient>
    <linearGradient id="lenovoCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242129" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#18181f" stop-opacity="0.9" />
    </linearGradient>
    <filter id="lenovoShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="480" rx="20" fill="url(#lenovoBg)" />
  <rect width="1000" height="480" rx="20" fill="none" stroke="#e2231a" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Ambient Glow Circles -->
  <circle cx="850" cy="120" r="180" fill="#e2231a" fill-opacity="0.14" filter="blur(45px)" />
  <circle cx="150" cy="380" r="160" fill="#ff3d34" fill-opacity="0.08" filter="blur(40px)" />

  <!-- Subtle Precision Tech Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="120" x2="1000" y2="120" />
    <line x1="0" y1="240" x2="1000" y2="240" />
    <line x1="0" y1="360" x2="1000" y2="360" />
    <line x1="250" y1="0" x2="250" y2="480" />
    <line x1="500" y1="0" x2="500" y2="480" />
    <line x1="750" y1="0" x2="750" y2="480" />
  </g>

  <!-- Header Badge: Iconic Lenovo Red Tag -->
  <g transform="translate(48, 38)">
    <!-- Red Lenovo Box -->
    <rect x="0" y="0" width="100" height="28" rx="6" fill="#e2231a" />
    <text x="50" y="19" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" letter-spacing="1">Lenovo</text>
    
    <!-- Partner Text -->
    <text x="114" y="19" fill="#ff6b64" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="0.5">OFFICIAL INDIA STORE • EXCLUSIVE PARTNER DEALS</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(48, 105)">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
      लैपटॉप, टैबलेट व पीसी पर भारी छूट — 50% तक OFF!
    </text>
    <text x="0" y="38" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">
      Lenovo India • <tspan fill="#ff3d34" font-weight="800">IdeaPad, ThinkPad &amp; Yoga</tspan> — छात्रों व प्रोफेशनल्स के लिए बेस्ट ऑफर्स
    </text>
  </g>

  <!-- 3 Value Proposition Cards -->
  <g transform="translate(48, 180)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="280" height="110" rx="16" fill="url(#lenovoCard)" stroke="#e2231a" stroke-opacity="0.3" stroke-width="1.2" filter="url(#lenovoShadow)" />
    <circle cx="36" cy="38" r="18" fill="#e2231a" fill-opacity="0.35" />
    <text x="36" y="44" text-anchor="middle" font-size="18">💻</text>
    <text x="68" y="34" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800">लेटेस्ट जनरेशन लैपटॉप</text>
    <text x="68" y="56" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Intel Core &amp; AMD Ryzen</text>
    <text x="68" y="76" fill="#4ade80" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">सुपरफास्ट स्पीड व SSD</text>

    <!-- Card 2 -->
    <rect x="310" y="0" width="280" height="110" rx="16" fill="url(#lenovoCard)" stroke="#e2231a" stroke-opacity="0.3" stroke-width="1.2" filter="url(#lenovoShadow)" />
    <circle cx="346" cy="38" r="18" fill="#e2231a" fill-opacity="0.35" />
    <text x="346" y="44" text-anchor="middle" font-size="18">🎓</text>
    <text x="378" y="34" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800">स्टूडेंट स्पेशल डिस्काउंट</text>
    <text x="378" y="56" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">अतिरिक्त 5% से 10% की छूट</text>
    <text x="378" y="76" fill="#ff6b64" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">कॉलेज व स्कूल स्टूडेंट्स हेतु</text>

    <!-- Card 3 -->
    <rect x="620" y="0" width="280" height="110" rx="16" fill="url(#lenovoCard)" stroke="#e2231a" stroke-opacity="0.3" stroke-width="1.2" filter="url(#lenovoShadow)" />
    <circle cx="656" cy="38" r="18" fill="#e2231a" fill-opacity="0.35" />
    <text x="656" y="44" text-anchor="middle" font-size="18">🛡️</text>
    <text x="688" y="34" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800">No-Cost EMI &amp; वारंटी</text>
    <text x="688" y="56" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">आसान किस्तों पर उपलब्ध</text>
    <text x="688" y="76" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">100% ओरिजिनल + फ्री डिलीवरी</text>
  </g>

  <!-- Bottom Action Bar: Discount Pill + CTA Button -->
  <g transform="translate(48, 335)">
    <!-- Discount highlight -->
    <rect x="0" y="8" width="140" height="42" rx="10" fill="#e2231a" />
    <text x="70" y="35" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900">
      UP TO 50% OFF
    </text>

    <!-- Subtext -->
    <text x="155" y="24" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Lenovo India Official Store:</text>
    <text x="155" y="50" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900">
      <tspan fill="#ff3d34">₹19,990</tspan><tspan font-size="14" fill="#cbd5e1"> से शुरू • वारंटी शामिल*</tspan>
    </text>

    <!-- Big Action Button -->
    <g transform="translate(580, 0)">
      <rect x="0" y="0" width="320" height="58" rx="18" fill="url(#lenovoRedGrad)" filter="url(#lenovoShadow)" />
      <text x="160" y="36" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900">
        ऑफर देखें (Shop Laptops) →
      </text>
    </g>
  </g>
</svg>
