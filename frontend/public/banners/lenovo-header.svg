<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" width="100%" height="100%">
  <defs>
    <linearGradient id="lnvHdrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121214" />
      <stop offset="50%" stop-color="#24171d" />
      <stop offset="100%" stop-color="#0e0f14" />
    </linearGradient>
    <linearGradient id="lnvHdrBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2231a" />
      <stop offset="100%" stop-color="#ff3d34" />
    </linearGradient>
    <linearGradient id="lnvGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2231a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#e2231a" stop-opacity="0" />
    </linearGradient>
    <filter id="lnvHdrShadow" x="-5%" y="-10%" width="115%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="160" rx="16" fill="url(#lnvHdrBg)" />
  <rect width="1000" height="160" rx="16" fill="none" stroke="#e2231a" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Speed Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="40" x2="1000" y2="40" />
    <line x1="0" y1="80" x2="1000" y2="80" />
    <line x1="0" y1="120" x2="1000" y2="120" />
    <line x1="200" y1="0" x2="200" y2="160" />
    <line x1="400" y1="0" x2="400" y2="160" />
    <line x1="600" y1="0" x2="600" y2="160" />
    <line x1="800" y1="0" x2="800" y2="160" />
  </g>

  <!-- Glow -->
  <circle cx="90" cy="80" r="120" fill="url(#lnvGlow)" filter="blur(20px)" />

  <!-- Left: Lenovo Tag Icon -->
  <g transform="translate(24, 28)">
    <rect x="0" y="0" width="104" height="104" rx="20" fill="#201c24" stroke="#e2231a" stroke-width="2.5" filter="url(#lnvHdrShadow)" />
    <!-- Iconic Laptop Silhouette -->
    <rect x="22" y="32" width="60" height="38" rx="4" fill="none" stroke="#ffffff" stroke-width="2.5" />
    <line x1="16" y1="74" x2="88" y2="74" stroke="#e2231a" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="52" cy="51" r="5" fill="#ff3d34" />
  </g>

  <!-- Brand Name & Deal Badge -->
  <g transform="translate(144, 34)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="75" height="22" rx="4" fill="#e2231a" />
      <text x="37" y="15" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900">Lenovo</text>
      <text x="86" y="15" fill="#ff6b64" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">EXCLUSIVE MEGA DEALS • FLAT 50% OFF</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="52" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" letter-spacing="-0.5">
      Lenovo Laptops &amp; Tablets <tspan fill="#ff3d34">• भारी छूट</tspan>
    </text>

    <!-- Subtitle / Perks -->
    <text x="0" y="78" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">
      IdeaPad, ThinkPad &amp; Yoga • नो-कॉस्ट EMI + स्टूडेंट डिस्काउंट + फ्री डिलीवरी
    </text>
  </g>

  <!-- Center-Right: Price Highlight Badge -->
  <g transform="translate(630, 28)">
    <rect x="0" y="0" width="150" height="104" rx="16" fill="#1b1c24" stroke="#e2231a" stroke-opacity="0.35" stroke-width="1.5" />
    <text x="75" y="28" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">लैपटॉप रेंज शुरू</text>
    <text x="75" y="64" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900">
      <tspan fill="#ff3d34">₹19,990</tspan><tspan font-size="12" fill="#94a3b8">*</tspan>
    </text>
    <text x="75" y="88" text-anchor="middle" fill="#4ade80" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">NO-COST EMI</text>
  </g>

  <!-- Right: CTA Button -->
  <g transform="translate(800, 44)">
    <rect x="0" y="0" width="176" height="72" rx="18" fill="url(#lnvHdrBtn)" filter="url(#lnvHdrShadow)" />
    <text x="88" y="38" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" letter-spacing="0.2">
      ऑफर देखें →
    </text>
    <text x="88" y="58" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">
      (Shop Lenovo)
    </text>
  </g>
</svg>
