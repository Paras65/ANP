<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <linearGradient id="ncArtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="50%" stop-color="#211724" />
      <stop offset="100%" stop-color="#0e121a" />
    </linearGradient>
    <linearGradient id="ncArtBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5722" />
      <stop offset="100%" stop-color="#de3723" />
    </linearGradient>
    <filter id="ncArtShadow" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="320" rx="18" fill="url(#ncArtBg)" />
  <rect width="1000" height="320" rx="18" fill="none" stroke="#de3723" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Soft Ambient Glow -->
  <circle cx="900" cy="80" r="140" fill="#de3723" fill-opacity="0.12" filter="blur(30px)" />
  <circle cx="80" cy="240" r="120" fill="#ff7043" fill-opacity="0.1" filter="blur(30px)" />

  <!-- Badge -->
  <g transform="translate(40, 32)">
    <rect x="0" y="0" width="220" height="26" rx="13" fill="#de3723" fill-opacity="0.2" stroke="#de3723" stroke-opacity="0.6" stroke-width="1" />
    <text x="12" y="17" fill="#ff7043" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" letter-spacing="1">✨ OFFICIAL DOMAIN PARTNER</text>
  </g>

  <!-- Heading -->
  <g transform="translate(40, 95)">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">
      अपने बिज़नेस या ब्रांड के लिए .COM या .IN डोमेन बुक करें
    </text>
    <text x="0" y="32" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">
      Namecheap के साथ पाएं — <tspan fill="#ff7043" font-weight="800">लाइफटाइम मुफ़्त Privacy Protection + फ्री DNSSEC + 24/7 सपोर्ट</tspan>
    </text>
  </g>

  <!-- Feature Bullet Points -->
  <g transform="translate(40, 175)">
    <g transform="translate(0, 0)">
      <circle cx="12" cy="12" r="12" fill="#de3723" fill-opacity="0.4" />
      <text x="12" y="16" text-anchor="middle" font-size="12">✓</text>
      <text x="32" y="16" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">100% फ्री WhoisGuard</text>
    </g>

    <g transform="translate(220, 0)">
      <circle cx="12" cy="12" r="12" fill="#de3723" fill-opacity="0.4" />
      <text x="12" y="16" text-anchor="middle" font-size="12">✓</text>
      <text x="32" y="16" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">नो हिडन रिन्यूअल फीस</text>
    </g>

    <g transform="translate(440, 0)">
      <circle cx="12" cy="12" r="12" fill="#de3723" fill-opacity="0.4" />
      <text x="12" y="16" text-anchor="middle" font-size="12">✓</text>
      <text x="32" y="16" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">आसान DNS सेटअप</text>
    </g>
  </g>

  <!-- Bottom CTA Row -->
  <g transform="translate(40, 235)">
    <rect x="0" y="4" width="160" height="38" rx="10" fill="#1b1d28" stroke="#de3723" stroke-opacity="0.5" stroke-width="1.2" />
    <text x="80" y="27" text-anchor="middle" fill="#ff7043" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900">
      मात्र ₹499/वर्ष से*
    </text>

    <g transform="translate(680, -6)">
      <rect x="0" y="0" width="240" height="52" rx="16" fill="url(#ncArtBtn)" filter="url(#ncArtShadow)" />
      <text x="120" y="32" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900">
        सर्च डोमेन (Namecheap) →
      </text>
    </g>
  </g>
</svg>
