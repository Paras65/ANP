<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="ncBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="50%" stop-color="#1e1822" />
      <stop offset="100%" stop-color="#0e121a" />
    </linearGradient>
    <linearGradient id="ncBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5722" />
      <stop offset="100%" stop-color="#de3723" />
    </linearGradient>
    <linearGradient id="ncCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221e28" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#181a24" stop-opacity="0.9" />
    </linearGradient>
    <filter id="ncShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="480" rx="20" fill="url(#ncBg)" />
  <rect width="1000" height="480" rx="20" fill="none" stroke="#de3723" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Ambient Glow Circles -->
  <circle cx="850" cy="120" r="180" fill="#de3723" fill-opacity="0.15" filter="blur(45px)" />
  <circle cx="150" cy="380" r="160" fill="#ff7043" fill-opacity="0.1" filter="blur(40px)" />

  <!-- Header Category Pill -->
  <g transform="translate(48, 38)">
    <rect x="0" y="0" width="235" height="28" rx="14" fill="#de3723" fill-opacity="0.2" stroke="#de3723" stroke-opacity="0.6" stroke-width="1" />
    <text x="14" y="19" fill="#ff7043" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" letter-spacing="1">⚡ OFFICIAL DOMAIN PARTNER</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(48, 105)">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" letter-spacing="-0.5">
      अपना मनपसंद डोमेन नेम आज ही रजिस्टर करें!
    </text>
    <text x="0" y="38" fill="#ff8a65" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">
      Namecheap • विश्व का सबसे भरोसेमंद डोमेन रजिस्ट्रार &amp; वेब सिक्योरिटी
    </text>
  </g>

  <!-- 3 Value Proposition Feature Cards -->
  <g transform="translate(48, 180)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="280" height="110" rx="16" fill="url(#ncCard)" stroke="#de3723" stroke-opacity="0.3" stroke-width="1.2" filter="url(#ncShadow)" />
    <circle cx="36" cy="38" r="18" fill="#de3723" fill-opacity="0.3" />
    <text x="36" y="44" text-anchor="middle" font-size="18">🔒</text>
    <text x="68" y="34" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800">फ्री Privacy Protection</text>
    <text x="68" y="56" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">लाइफटाइम मुफ़्त WhoisGuard</text>
    <text x="68" y="76" fill="#4ade80" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">पर्सनल डेटा सुरक्षित रखें</text>

    <!-- Card 2 -->
    <rect x="310" y="0" width="280" height="110" rx="16" fill="url(#ncCard)" stroke="#de3723" stroke-opacity="0.3" stroke-width="1.2" filter="url(#ncShadow)" />
    <circle cx="346" cy="38" r="18" fill="#de3723" fill-opacity="0.3" />
    <text x="346" y="44" text-anchor="middle" font-size="18">🌐</text>
    <text x="378" y="34" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800">.COM, .IN, .ORG</text>
    <text x="378" y="56" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">भारत में सबसे किफायती दरें</text>
    <text x="378" y="76" fill="#ff7043" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">1-क्लिक आसान DNS मैनेजमेंट</text>

    <!-- Card 3 -->
    <rect x="620" y="0" width="280" height="110" rx="16" fill="url(#ncCard)" stroke="#de3723" stroke-opacity="0.3" stroke-width="1.2" filter="url(#ncShadow)" />
    <circle cx="656" cy="38" r="18" fill="#de3723" fill-opacity="0.3" />
    <text x="656" y="44" text-anchor="middle" font-size="18">🛡️</text>
    <text x="688" y="34" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800">फ्री DNSSEC &amp; SSL</text>
    <text x="688" y="56" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">हैकिंग व स्पूफिंग से सुरक्षा</text>
    <text x="688" y="76" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">24/7 लाइव सपोर्ट</text>
  </g>

  <!-- Bottom Action Bar: Price + CTA Button -->
  <g transform="translate(48, 335)">
    <!-- Discount highlight -->
    <rect x="0" y="8" width="130" height="42" rx="10" fill="#de3723" />
    <text x="65" y="35" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900">
      SPECIAL DEAL
    </text>

    <!-- Price -->
    <text x="145" y="24" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">डोमेन रजिस्ट्रेशन मात्र:</text>
    <text x="145" y="50" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900">
      <tspan fill="#ff7043">₹499</tspan><tspan font-size="14" fill="#cbd5e1"> / वर्ष से*</tspan>
    </text>

    <!-- Big Action Button -->
    <g transform="translate(580, 0)">
      <rect x="0" y="0" width="320" height="58" rx="18" fill="url(#ncBtn)" filter="url(#ncShadow)" />
      <text x="160" y="36" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900">
        सर्च डोमेन (Find Domain) →
      </text>
    </g>
  </g>
</svg>
