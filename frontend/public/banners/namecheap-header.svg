<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" width="100%" height="100%">
  <defs>
    <linearGradient id="ncHdrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="50%" stop-color="#241720" />
      <stop offset="100%" stop-color="#0e121a" />
    </linearGradient>
    <linearGradient id="ncHdrBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5722" />
      <stop offset="100%" stop-color="#de3723" />
    </linearGradient>
    <linearGradient id="ncGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#de3723" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#de3723" stop-opacity="0" />
    </linearGradient>
    <filter id="ncHdrShadow" x="-5%" y="-10%" width="115%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="160" rx="16" fill="url(#ncHdrBg)" />
  <rect width="1000" height="160" rx="16" fill="none" stroke="#de3723" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Speed Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="40" x2="1000" y2="40" />
    <line x1="0" y1="80" x2="1000" y2="80" />
    <line x1="0" y1="120" x2="1000" y2="120" />
    <line x1="200" y1="0" x2="200" y2="160" />
    <line x1="400" y1="0" x2="400" y2="160" />
    <line x1="600" y1="0" x2="600" y2="160" />
    <line x1="800" y1="0" x2="800" y2="160" />
  </g>

  <!-- Glow -->
  <circle cx="90" cy="80" r="120" fill="url(#ncGlow)" filter="blur(20px)" />

  <!-- Left: Domain Icon -->
  <g transform="translate(24, 28)">
    <rect x="0" y="0" width="104" height="104" rx="20" fill="#221824" stroke="#de3723" stroke-width="2.5" filter="url(#ncHdrShadow)" />
    <!-- Globe / Lock Symbol -->
    <circle cx="52" cy="52" r="28" fill="none" stroke="#ff7043" stroke-width="3" />
    <ellipse cx="52" cy="52" rx="14" ry="28" fill="none" stroke="#ff7043" stroke-width="2.5" />
    <line x1="24" y1="52" x2="80" y2="52" stroke="#ff7043" stroke-width="2.5" />
  </g>

  <!-- Brand Name & Deal Badge -->
  <g transform="translate(144, 34)">
    <rect x="0" y="0" width="220" height="22" rx="11" fill="#de3723" fill-opacity="0.2" stroke="#de3723" stroke-opacity="0.6" stroke-width="1" />
    <text x="10" y="15" fill="#ff7043" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">⚡ OFFICIAL DOMAIN PARTNER</text>

    <!-- Main Title -->
    <text x="0" y="52" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" letter-spacing="-0.5">
      Namecheap <tspan fill="#ff7043">• .COM व .IN डोमेन</tspan>
    </text>

    <!-- Subtitle / Perks -->
    <text x="0" y="78" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">
      फ्री Whois Privacy Protection (लाइफटाइम) + फ्री DNSSEC + 24/7 सपोर्ट
    </text>
  </g>

  <!-- Center-Right: Price Highlight Badge -->
  <g transform="translate(630, 28)">
    <rect x="0" y="0" width="150" height="104" rx="16" fill="#1b1c26" stroke="#de3723" stroke-opacity="0.35" stroke-width="1.5" />
    <text x="75" y="28" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">डोमेन रजिस्ट्रेशन</text>
    <text x="75" y="64" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900">
      <tspan fill="#ff7043">₹499</tspan><tspan font-size="13" fill="#94a3b8">/वर्ष*</tspan>
    </text>
    <text x="75" y="88" text-anchor="middle" fill="#4ade80" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">FREE WHOISGUARD</text>
  </g>

  <!-- Right: CTA Button -->
  <g transform="translate(800, 44)">
    <rect x="0" y="0" width="176" height="72" rx="18" fill="url(#ncHdrBtn)" filter="url(#ncHdrShadow)" />
    <text x="88" y="38" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" letter-spacing="0.2">
      डोमेन खोजें →
    </text>
    <text x="88" y="58" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">
      (Find Domain)
    </text>
  </g>
</svg>
