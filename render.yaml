services:
  - type: web
    name: ambition-news-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://ambition-news-portal.vercel.app
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
